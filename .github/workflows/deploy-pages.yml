name: Deploy to GitHub Pages

# 静态站点（根目录即网站），推送本分支自动发布；也可在 Actions 页手动触发。
on:
  push:
    branches:
      - claude/energy-investment-calculator-spec-3ta87
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新发布取消进行中的旧发布
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整个仓库根目录就是网站（index.html 在根目录）
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
